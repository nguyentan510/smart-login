name: PHP quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.0 is the floor declared in omniwp.php; 8.4 catches new deprecations early.
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      # Dev-only: phpcs and the WordPress standard. Without it the coding
      # standards suite skips itself rather than failing.
      - name: Install dev dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      # Required suites must pass. Suites marked `spec` are reported in full but
      # do not block — currently only coding standards, whose deferred
      # documentation sniffs are justified in phpcs.xml.
      - name: Run test suites
        run: php tests/run-all.php
